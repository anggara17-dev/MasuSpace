<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasuSpace POS System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-cube"></i> MASU<br>SPACE
            </div>
            <div class="date-display" id="currentDate">Loading...</div>
        </div>
        <div class="header-right">
            <div class="header-stat">Today: <strong id="totalOrders">0 Orders</strong></div>
            <div class="user-profile">
                <div class="user-avatar">MS</div>
                <div class="user-info">
                    <div class="user-name">Admin Masu</div>
                    <div class="user-role">Cashier</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        
        <!-- Left Panel: Products -->
        <div class="left-panel">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search menu..." id="searchInput">
                <button class="filter-btn"><i class="fas fa-sliders-h"></i></button>
            </div>

            <div class="categories" id="categoriesContainer">
                <!-- Categories injected by JS -->
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products injected by JS -->
                <div class="loading">Loading products...</div>
            </div>
        </div>

        <!-- Right Panel: Cart/Order -->
        <div class="right-panel">
            <div class="order-header">
                <div class="order-title">
                    <h3>Current Order</h3>
                    <p id="orderNumber">#NEW ORDER</p>
                </div>
            </div>

            <div class="order-type-toggle">
                <button class="type-btn active" onclick="setOrderType('dine_in', this)">Dine In</button>
                <button class="type-btn" onclick="setOrderType('takeaway', this)">Take Away</button>
            </div>

            <div class="customer-info">
                <div class="input-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" placeholder="Walk-in Customer">
                </div>
                <div class="input-group">
                    <label>Table / Note</label>
                    <input type="text" id="tableNumber" placeholder="Table 1">
                </div>
            </div>

            <div class="order-list-header">Order List</div>
            <div class="order-list" id="orderList">
                <div class="empty-order">
                    <i class="fas fa-shopping-basket"></i>
                    <p>No items yet</p>
                </div>
            </div>

            <div class="payment-details">
                <div class="payment-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rp 0</span>
                </div>
                <div class="payment-row">
                    <span>Tax (10%)</span>
                    <span id="tax">Rp 0</span>
                </div>
                <div class="payment-row total">
                    <span>Total</span>
                    <span id="total">Rp 0</span>
                </div>
            </div>

            <button class="place-order-btn" id="placeOrderBtn" onclick="processCheckout()" disabled>
                <span>Place Order</span>
                <span id="btnTotal">Rp 0</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Notification</div>

    <script src="app.js"></script>
</body>
</html>
